<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gloomward</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font: 14px system-ui, sans-serif; text-align: center; pointer-events: none; z-index: 1000; }
    #version { position: fixed; bottom: 8px; right: 8px; color: #444; font: 10px monospace; pointer-events: none; z-index: 100; }
    #error-panel { position: fixed; top: 20px; right: 20px; z-index: 1000; max-width: 500px; display: none; }
    .error-box { background: rgba(20, 0, 0, 0.95); color: #ff6666; padding: 20px; border: 2px solid #ff3333; border-radius: 4px; font: 12px monospace; }
  </style>
</head>
<body>
  <div id="loading">Loading Gloomward…</div>
  <div id="version">v0.1.0</div>
  <div id="error-panel"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/core": "./vendor/three/three.core.js"
    }
  }
  </script>
  <script type="module">
    console.log('Module script starting...');
    
    try {
      const { Game } = await import('./src/core/game.js');
      console.log('Game module loaded successfully');
      
      const loading = document.getElementById('loading');
      console.log('Loading element found:', !!loading);
      
      const canvas = document.createElement('canvas');
      document.body.appendChild(canvas);
      console.log('Canvas created and appended');

      const game = new Game(canvas);
      console.log('Game instance created');

      // Click to begin - required for AudioContext
      function startGame() {
        console.log('User interaction detected, starting game...');
        document.removeEventListener('click', startGame);
        document.removeEventListener('keydown', startGame);
        if (loading) loading.textContent = 'Initializing…';
        game.init().then(() => {
          console.log('Game init succeeded');
          if (loading) loading.remove();
          console.log('Gloomward ready');
        }).catch(e => {
          console.error('Game init failed:', e);
          if (loading) loading.textContent = 'Failed to load: ' + e.message;
          console.error(e);
        });
      }

      document.addEventListener('click', startGame, { once: true });
      document.addEventListener('keydown', startGame, { once: true });
      console.log('Event listeners added, waiting for user interaction...');

      // Expose for debugging
      window.game = game;
      console.log('Setup complete, waiting for click...');
    } catch (e) {
      console.error('Module load error:', e);
      const loading = document.getElementById('loading');
      if (loading) loading.textContent = 'Module load error: ' + e.message;
    }
  </script>
</body>
</html>
